name: Autocalificación Python

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
    - name: Run unit tests
      run: |
        python -m pip install --upgrade pip
        python -m unittest test_solucion.py